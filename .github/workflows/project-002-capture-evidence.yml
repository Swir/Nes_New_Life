name: Project 002 Capture Evidence Guard

on:
  pull_request:
    paths:
      - 'projects/002_tiny_toon_visual_remaster/evidence/capture/**'
      - 'projects/002_tiny_toon_visual_remaster/tools/capture_evidence_validator.py'
      - 'projects/002_tiny_toon_visual_remaster/tools/capture_evidence_triage.py'
      - 'projects/002_tiny_toon_visual_remaster/tests/test_capture_evidence_triage.py'
      - '.github/workflows/project-002-capture-evidence.yml'

permissions:
  contents: read

jobs:
  validate-safe-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile evidence tools
        run: |
          python -m py_compile projects/002_tiny_toon_visual_remaster/tools/capture_evidence_validator.py
          python -m py_compile projects/002_tiny_toon_visual_remaster/tools/capture_evidence_triage.py
      - name: Validate and triage metadata-only evidence tree
        shell: bash
        run: |
          EVIDENCE='projects/002_tiny_toon_visual_remaster/evidence/capture'
          VALIDATOR='projects/002_tiny_toon_visual_remaster/tools/capture_evidence_validator.py'
          TRIAGE='projects/002_tiny_toon_visual_remaster/tools/capture_evidence_triage.py'
          if find "$EVIDENCE" -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python "$VALIDATOR" "$EVIDENCE"
            python "$TRIAGE" "$EVIDENCE" --github-summary "$GITHUB_STEP_SUMMARY"
          else
            echo 'No capture evidence JSON in this PR; evidence tooling syntax check only.'
            echo '# Project #002 — Capture Evidence Triage' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No safe capture evidence snapshot is present in this PR.' >> "$GITHUB_STEP_SUMMARY"
          fi
