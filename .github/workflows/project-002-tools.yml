name: Project 002 Tools

on:
  push:
    branches: [main]
    paths:
      - 'projects/002_tiny_toon_visual_remaster/**'
      - '.github/workflows/project-002-tools.yml'
  pull_request:
    paths:
      - 'projects/002_tiny_toon_visual_remaster/**'
      - '.github/workflows/project-002-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r projects/002_tiny_toon_visual_remaster/requirements.txt
      - name: Compile Python tools
        run: python -m py_compile projects/002_tiny_toon_visual_remaster/tools/*.py
      - name: Run unit tests
        run: python -m unittest discover -s projects/002_tiny_toon_visual_remaster/tests -v
